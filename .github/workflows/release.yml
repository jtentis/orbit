name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # The app compares this number with the latest release tag to self-update.
      - name: Gravar número do build
        run: Set-Content -Path app/version.py -Value 'BUILD = ${{ github.run_number }}'
      - name: Testar e compilar
        run: ./build.ps1
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/THIRD_PARTY_LICENSES -DestinationPath dist/THIRD_PARTY_LICENSES.zip
          gh release create 'build-${{ github.run_number }}' dist/Orbit.exe dist/Orbit-source.zip dist/THIRD_PARTY_LICENSES.zip `
            --target $env:GITHUB_SHA --title 'Orbit build ${{ github.run_number }}' --generate-notes --latest
